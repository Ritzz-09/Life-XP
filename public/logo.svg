<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="darkPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#060b13" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Emblem on the left -->
  <g transform="translate(20, 10) scale(1.4)">
    <path
      d="M 50,8 L 84,24 C 84,60 50,88 50,92 C 50,88 16,60 16,24 Z"
      fill="url(#darkPlate)"
      stroke="url(#shieldGold)"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <path
      d="M 50,18 L 76,30 C 76,58 50,78 50,80 C 50,78 24,58 24,30 Z"
      fill="none"
      stroke="url(#shieldCyan)"
      stroke-width="1.5"
      stroke-dasharray="6 4"
      opacity="0.8"
    />
    <path
      d="M 54,24 L 38,50 L 51,50 L 46,72 L 64,44 L 51,44 Z"
      fill="url(#shieldGold)"
      filter="url(#logoGlow)"
    />
    <circle cx="50" cy="48" r="3" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="175" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#shieldGold)" letter-spacing="2">LIFE</text>
  <text x="325" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#shieldCyan)" letter-spacing="1">-XP</text>

  <!-- Tagline / Badge -->
  <rect x="470" y="58" width="80" height="42" rx="8" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
  <text x="486" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#38bdf8" letter-spacing="3">RPG</text>
</svg>