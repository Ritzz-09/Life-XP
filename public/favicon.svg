<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#060b13" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Glowing Shield Emblem -->
  <path d="M 256,60 L 410,130 C 410,280 256,420 256,450 C 256,420 102,280 102,130 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)" />
  
  <!-- Inner Shield Fill -->
  <path d="M 256,76 L 396,140 C 396,270 256,396 256,424 C 256,396 116,270 116,140 Z"
        fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="3" />

  <!-- Glowing Superhero Lightning / Energy Crest -->
  <path d="M 276,130 L 190,270 L 260,270 L 236,380 L 332,236 L 262,236 Z"
        fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Cyan Arc Runes -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="24 16" opacity="0.6" />
</svg>